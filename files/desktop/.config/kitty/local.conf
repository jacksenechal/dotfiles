# Personal kitty customizations, layered on Omarchy's ~/.config/kitty/kitty.conf.
#
# Omarchy owns that file and keeps it current; this file is included from its
# end, so everything here wins. Settings Omarchy already sets to the same value
# (hide_window_decorations, tab_bar_style, enable_audio_bell) are deliberately
# not repeated - no phantom overrides.

# --- Font
font_family Fira Code
font_size 11.0
font_weight normal

# --- Transparency
dynamic_background_opacity yes
background_opacity 0.9
background_blur 5
map kitty_mod+period set_background_opacity +0.1
map kitty_mod+comma set_background_opacity -0.1
map kitty_mod+slash set_background_opacity default

# --- Chrome. Omarchy ships window_padding_width 14; this reclaims the space.
window_border_width 0
window_padding_width 0
window_margin_width 0
window_border_height 0
window_padding_height 0
window_margin_height 0
draw_minimal_borders yes
scrollback_indicator_opacity 0.1
placement_strategy center
remember_window_size yes

# --- Layouts
map f1 goto_layout grid
map f2 goto_layout vertical
map f3 goto_layout horizontal
map f4 goto_layout splits

# --- Behavior
map ctrl+shift+t new_tab_with_cwd
touch_scroll_multiplier 2.0
scrollback_lines 10000

# Dropped from the old standalone config on purpose:
#   include ./theme.conf     - theme.conf never existed; Omarchy's theme include
#                              (first line of kitty.conf) now supplies colors.
#   allow_remote_control socket-only
#   listen_on unix:/tmp/kitty.sock
#                            - would break omarchy-launch-tui, which expects
#                              Omarchy's per-pid socket. Nothing referenced
#                              /tmp/kitty.sock.
