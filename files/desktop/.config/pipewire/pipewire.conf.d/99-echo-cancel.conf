context.modules = [
    { name = libpipewire-module-echo-cancel
      args = {
          # Uses the standard WebRTC Echo Cancellation engine
          library.name = aec/libspa-aec-webrtc
          node.latency = 1024/48000
          
          # Properties for the virtual mic that VoxType/Browsers will see
          source.props = {
              node.name = "Echo_Cancellation_Source"
              node.description = "Echo-Cancelled Microphone"
          }
          # Properties for the virtual sink that catches speaker audio
          sink.props = {
              node.name = "Echo_Cancellation_Sink"
              node.description = "Echo-Cancelled Playback"
          }
      }
    }
]
