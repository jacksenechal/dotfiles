# Personal tmux customizations, layered on Omarchy's ~/.config/tmux/tmux.conf.
#
# Omarchy owns that file and keeps it current through its migrations; this file
# is sourced from the end of it, so everything here wins. Nothing Omarchy ships
# is duplicated below - only genuine overrides and additions.

# --- Overrides of Omarchy defaults
set-option -g history-limit 100000  # Omarchy ships 50000

# NOTE: shadows Omarchy's prefix+k "Kill window". Kill a window with prefix+&
# (tmux default) or `tmux kill-window`.
bind k send-keys C-l \; send-keys -R \; clear-history

# --- Additions
# Keep tmux's stock split keys, but open in the current pane's directory.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Retain SSH agent forwarding across reattached sessions.
set -g update-environment -r

# True color for terminals that report as xterm-256color.
set -ga terminal-overrides ',xterm-256color:Tc'

# --- Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
# Previously guarded by a `tmux -V < 3.0` test that shelled out to bc. bc is not
# installed, so the test failed and this binding never got set. tmux is 3.7 here;
# the guard is gone and only the >= 3.0 form remains.
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
