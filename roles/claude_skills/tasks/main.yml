---
# ---------------------------------------------------------------------------
# (A) Ensure base directories exist
# ---------------------------------------------------------------------------
- name: Ensure required directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ claude_skills_home }}/workspace"
    - "{{ claude_skills_home }}/workspace/skills/third-party"
    - "{{ claude_skills_home }}/.claude"
    - "{{ claude_skills_home }}/.claude/hooks"
    - "{{ claude_skills_home }}/.claude/skills"

# ---------------------------------------------------------------------------
# (A2) Retire the pre-split layout. Before agent-tools was split into public and
#      private halves, ~/workspace/skills/local was a symlink into
#      agent-tools/skills. The clone below needs a real directory there, and the
#      git module fails against a symlink pointing at a non-repo. Removing a
#      symlink loses nothing; a real directory is left alone.
# ---------------------------------------------------------------------------
- name: Check ~/workspace/skills/local
  ansible.builtin.stat:
    path: "{{ claude_skills_home }}/workspace/skills/local"
    follow: false
  register: claude_skills_local_dir

- name: Remove the pre-split skills/local symlink
  ansible.builtin.file:
    path: "{{ claude_skills_home }}/workspace/skills/local"
    state: absent
  when: claude_skills_local_dir.stat.islnk | default(false)

# ---------------------------------------------------------------------------
# (B) Clone skill repos (update: no — never resets existing checkouts)
# ---------------------------------------------------------------------------
- name: Clone skill repos if absent
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    update: no
  loop: "{{ claude_skills_repos }}"
  loop_control:
    label: "{{ item.dest }}"

# ---------------------------------------------------------------------------
# (C) Convenience symlink: ~/workspace/skills/published -> agent-tools/skills
# ---------------------------------------------------------------------------
- name: Symlink skills/published -> agent-tools/skills
  ansible.builtin.file:
    src: "{{ claude_skills_home }}/workspace/agent-tools/skills"
    dest: "{{ claude_skills_home }}/workspace/skills/published"
    state: link
    force: yes

# ---------------------------------------------------------------------------
# (D) Claude skill symlinks: ~/.claude/skills/<name> -> <src>
# ---------------------------------------------------------------------------
- name: Symlink Claude skills into ~/.claude/skills/
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ claude_skills_home }}/.claude/skills/{{ item.name }}"
    state: link
    force: yes
  loop: "{{ claude_skills_skill_links }}"
  loop_control:
    label: "{{ item.name }}"

- name: Symlink workstation-only Claude skills
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ claude_skills_home }}/.claude/skills/{{ item.name }}"
    state: link
    force: yes
  loop: "{{ claude_skills_workstation_skill_links }}"
  loop_control:
    label: "{{ item.name }}"
  when: inventory_hostname in groups['local']

# (D2) `update: no` above means a stale checkout is never refreshed, which is
#      deliberate - it must never reset a repo with local work. The cost is that
#      a skill added upstream leaves a dangling symlink with no warning. Report
#      those rather than fixing them silently; the fix is a pull in that repo.
- name: Check that every skill link resolves
  ansible.builtin.stat:
    path: "{{ claude_skills_home }}/.claude/skills/{{ item.name }}"
  register: claude_skills_link_check
  loop: >-
    {{ claude_skills_skill_links
       + (claude_skills_workstation_skill_links
          if inventory_hostname in groups['local'] else []) }}
  loop_control:
    label: "{{ item.name }}"

- name: Report dangling skill links
  ansible.builtin.debug:
    msg: >-
      {{ item.item.name }} points at {{ item.item.src }}, which does not exist.
      That repo is probably behind; pull it and re-run.
  loop: "{{ claude_skills_link_check.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not (item.stat.exists | default(false))

# ---------------------------------------------------------------------------
# (E) Symlink global Claude config docs from the dotfiles repo.
#     These are SYMLINKED (not copied) so editing the live file edits the repo
#     file directly: `git diff` shows the truth and re-applying this role can
#     never clobber local edits (the copy-based approach did). The canonical
#     sources live under files/home/.claude/ and are also picked up by the
#     `files` role on hosts where that role's link_tree runs.
#     The src is HOME-relative (not {{ playbook_dir }}) so the link resolves
#     on every host regardless of its home dir; it requires the dotfiles repo
#     checked out at ~/workspace/dotfiles (kept current by sync-claude-config).
# ---------------------------------------------------------------------------
- name: Symlink CLAUDE.md from the dotfiles repo
  ansible.builtin.file:
    src: "{{ claude_skills_home }}/workspace/dotfiles/files/home/.claude/CLAUDE.md"
    dest: "{{ claude_skills_home }}/.claude/CLAUDE.md"
    state: link
    force: yes

- name: Symlink security-requirements.md from the dotfiles repo
  ansible.builtin.file:
    src: "{{ claude_skills_home }}/workspace/dotfiles/files/home/.claude/security-requirements.md"
    dest: "{{ claude_skills_home }}/.claude/security-requirements.md"
    state: link
    force: yes

- name: Symlink block-shai-hulud hook from the dotfiles repo
  ansible.builtin.file:
    src: "{{ claude_skills_home }}/workspace/dotfiles/files/home/.claude/hooks/block-shai-hulud.sh"
    dest: "{{ claude_skills_home }}/.claude/hooks/block-shai-hulud.sh"
    state: link
    force: yes

- name: Symlink request-bypass operator switch from the dotfiles repo
  ansible.builtin.file:
    src: "{{ claude_skills_home }}/workspace/dotfiles/files/home/.claude/hooks/request-bypass"
    dest: "{{ claude_skills_home }}/.claude/hooks/request-bypass"
    state: link
    force: yes

# Project memory directories synced via dotfiles (whole-dir symlinks). The slug is
# Claude's path-derived project key, so this only works on hosts where the project
# is checked out at the same path. force is deliberately absent: if a real memory
# dir already exists on a host, fail loudly rather than clobber it — merge by hand.
- name: Ensure synced project dirs exist under ~/.claude/projects
  ansible.builtin.file:
    path: "{{ claude_skills_home }}/.claude/projects/{{ item }}"
    state: directory
  loop:
    - "-home-jack-workspace-contract-jfwelderheirs-com-v2"

- name: Symlink synced project memory dirs from the dotfiles repo
  ansible.builtin.file:
    src: "{{ claude_skills_home }}/workspace/dotfiles/files/home/.claude/projects/{{ item }}/memory"
    dest: "{{ claude_skills_home }}/.claude/projects/{{ item }}/memory"
    state: link
  loop:
    - "-home-jack-workspace-contract-jfwelderheirs-com-v2"

# ---------------------------------------------------------------------------
# (F) Register shai-hulud hook in ~/.claude/settings.json without owning
#     the whole file. Strategy:
#       1. slurp existing file (base64) or default to empty object.
#       2. Parse JSON, extract existing PreToolUse list (default []).
#       3. Test whether an entry matching our hook command already exists.
#       4. If absent, append our entry and write back (idempotent on second
#          run because the entry will be found and no write occurs).
# ---------------------------------------------------------------------------
- name: Read ~/.claude/settings.json if it exists
  ansible.builtin.slurp:
    src: "{{ claude_skills_home }}/.claude/settings.json"
  register: claude_skills_settings_raw
  ignore_errors: yes

- name: Parse existing settings (default to empty object if absent)
  ansible.builtin.set_fact:
    claude_skills_settings: >-
      {{
        (claude_skills_settings_raw.content | default('e30K') | b64decode | from_json)
        if claude_skills_settings_raw is not failed
        else {}
      }}

- name: Check whether shai-hulud hook entry is already registered
  ansible.builtin.set_fact:
    claude_skills_hook_present: >-
      {{
        (claude_skills_settings.get('hooks', {}).get('PreToolUse', [])
         | selectattr('hooks', 'defined')
         | map(attribute='hooks')
         | flatten
         | selectattr('command', 'defined')
         | selectattr('command', 'equalto', claude_skills_hook_entry.hooks[0].command)
         | list
         | length) > 0
      }}

- name: Merge shai-hulud hook entry into settings.json
  ansible.builtin.copy:
    dest: "{{ claude_skills_home }}/.claude/settings.json"
    content: >-
      {{
        claude_skills_settings
        | combine({
            'hooks': (claude_skills_settings.get('hooks', {}))
            | combine({
                'PreToolUse': (
                  claude_skills_settings.get('hooks', {}).get('PreToolUse', [])
                  + [claude_skills_hook_entry]
                )
              })
          })
        | to_nice_json
      }}
    mode: "0644"
  when: not claude_skills_hook_present

# ---------------------------------------------------------------------------
# (G) Enforce managed top-level settings.json keys (idempotent, non-owning).
#     Same philosophy as the hook merge: settings.json stays host-managed so
#     Claude Code can keep writing volatile keys (theme, model, ...) to it —
#     we only guarantee the keys in claude_skills_settings_defaults hold their
#     managed value. Re-slurp first because the hook task above may have just
#     rewritten the file. Shallow combine overlays only these keys and writes
#     only when something would actually change (so it is churn-free).
# ---------------------------------------------------------------------------
- name: Re-read settings.json before enforcing managed defaults
  ansible.builtin.slurp:
    src: "{{ claude_skills_home }}/.claude/settings.json"
  register: claude_skills_settings_raw2
  ignore_errors: yes

- name: Parse settings for managed-defaults merge
  ansible.builtin.set_fact:
    claude_skills_settings2: >-
      {{
        (claude_skills_settings_raw2.content | default('e30K') | b64decode | from_json)
        if claude_skills_settings_raw2 is not failed
        else {}
      }}

- name: Enforce managed default keys in settings.json
  ansible.builtin.copy:
    dest: "{{ claude_skills_home }}/.claude/settings.json"
    content: "{{ claude_skills_settings2 | combine(claude_skills_settings_defaults) | to_nice_json }}"
    mode: "0644"
  when: >-
    (claude_skills_settings2 | combine(claude_skills_settings_defaults))
    != claude_skills_settings2
