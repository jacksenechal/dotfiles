---
- name: Copy config files into place
  ansible.posix.synchronize:
    src: files/home/
    dest: ~/
    recursive: yes
    perms: yes
    rsync_opts:
      - '--itemize-changes'

- name: Copy desktop-only config files into place
  ansible.posix.synchronize:
    src: files/desktop/
    dest: ~/
    recursive: yes
    perms: yes
    rsync_opts:
      - '--itemize-changes'
  when: inventory_hostname in groups['local']

- name: Ensure bashrc line exists
  ansible.builtin.lineinfile:
    path: ~/.bashrc
    line: "[ -f ~/.bashrc_jack ] && source ~/.bashrc_jack"
    state: present
