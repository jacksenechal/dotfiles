---
# Base files below are Omarchy's and stay untracked, so its migrations can keep
# updating them. Omarchy's migrations checksum these files and skip ones you have
# modified, so leaving them pristine is what keeps them current.
#
# `path` is relative to $HOME; `comment` is the file's comment leader.
omarchy_overlay_includes:
  - name: tmux
    path: .config/tmux/tmux.conf
    comment: "#"
    line: source-file -q ~/.config/tmux/local.conf

  - name: kitty
    path: .config/kitty/kitty.conf
    comment: "#"
    line: include ./local.conf


omarchy_overlay_symlink_checks:
  - .config/tmux/local.conf
  - .config/kitty/local.conf
  # Omarchy's own hypr override files, symlinked outright rather than overlaid.
  # They carry no settings of their own - the defaults live in
  # $OMARCHY_PATH/default/hypr and load first - so owning them causes no drift and
  # needs no include line. Only one migration has ever touched input.lua or
  # bindings.lua; it is checksum-guarded and uses `cp`, which writes through a
  # symlink rather than replacing it.
  - .config/hypr/input.lua
  - .config/hypr/bindings.lua
  - .config/hypr/looknfeel.lua
