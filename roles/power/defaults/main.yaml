---
# How long suspend-then-hibernate stays in s2idle on battery before writing RAM
# to disk and powering off. systemd hibernates earlier if its battery estimate
# says the pack would run flat first (systemd-sleep.conf(5)).
power_hibernate_delay: 3h
# On AC, stay suspended instead of hibernating: no LUKS prompt when waking at
# the desk. The countdown starts when the cord is pulled.
power_hibernate_on_ac: false
