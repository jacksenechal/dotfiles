---
# Hibernation itself (swapfile, initramfs resume hook, Limine resume= and
# rtc_cmos.use_acpi_alarm=1 cmdline) is a one-time interactive step, like
# fingerprint setup: run `omarchy hibernation setup` by hand and reboot. This
# role only follows it with the two systemd drop-ins that make the lid use
# suspend-then-hibernate. Both are inert until that setup exists, and
# `omarchy hibernation available` is Omarchy's public check for it.
- name: Check whether Omarchy hibernation is set up
  ansible.builtin.command:
    argv: [omarchy-hibernation-available]
  register: hibernation
  check_mode: false  # read-only probe; keep it live so --check gates correctly
  changed_when: false
  failed_when: false

- name: Skip unless hibernation is available
  ansible.builtin.meta: end_role
  when: hibernation.rc != 0

- name: Ensure the sleep.conf.d directory exists
  become: yes
  ansible.builtin.file:
    path: /etc/systemd/sleep.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install suspend-then-hibernate timing
  become: yes
  ansible.builtin.template:
    src: 50-hibernate.conf.j2
    dest: /etc/systemd/sleep.conf.d/50-hibernate.conf
    owner: root
    group: root
    mode: '0644'

- name: Close the lid into suspend-then-hibernate
  become: yes
  ansible.builtin.copy:
    src: system/etc/systemd/logind.conf.d/30-lid-suspend-then-hibernate.conf
    dest: /etc/systemd/logind.conf.d/30-lid-suspend-then-hibernate.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart systemd-logind
