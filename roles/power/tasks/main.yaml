---
- name: Resolve power settings for this machine
  ansible.builtin.set_fact:
    power: >-
      {{ power_defaults
         | combine(power_machines[ansible_facts['hostname']] | default({})) }}

- name: Skip unless hibernation is enabled for this machine
  ansible.builtin.meta: end_role
  when: not power.hibernation

- name: Detect Omarchy
  ansible.builtin.stat:
    path: /usr/bin/omarchy-hibernation-setup
  register: omarchy_hibernation_setup

- name: Hibernation is Omarchy-only here
  ansible.builtin.assert:
    that: omarchy_hibernation_setup.stat.exists
    fail_msg: >-
      power.hibernation is set for {{ ansible_facts['hostname'] }} but
      omarchy-hibernation-setup is not installed. This role relies on it for
      the swapfile, resume hook, and Limine cmdline.

# Idempotent by Omarchy's own check (omarchy_resume.conf present => exit 0),
# and by `creates` so ansible reports it unchanged. --force skips the gum
# prompts and the reboot offer. The script calls sudo internally, which is a
# no-op under become. OMARCHY_PATH is needed for the keyboard-backlight hook
# copy and is normally only exported in an interactive shell.
- name: Run omarchy hibernation setup
  become: yes
  ansible.builtin.command:
    argv: [omarchy-hibernation-setup, --force]
    creates: /etc/limine-entry-tool.d/resume.conf
  environment:
    OMARCHY_PATH: /usr/share/omarchy
  register: hibernation_setup

- name: Confirm Omarchy considers hibernation available
  ansible.builtin.command:
    argv: [omarchy-hibernation-available]
  changed_when: false

- name: Install suspend-then-hibernate timing
  become: yes
  ansible.builtin.template:
    src: 50-hibernate.conf.j2
    dest: /etc/systemd/sleep.conf.d/50-hibernate.conf
    owner: root
    group: root
    mode: '0644'

- name: Close the lid into suspend-then-hibernate
  become: yes
  ansible.builtin.copy:
    src: system/etc/systemd/logind.conf.d/30-lid-suspend-then-hibernate.conf
    dest: /etc/systemd/logind.conf.d/30-lid-suspend-then-hibernate.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart systemd-logind

- name: Reboot needed for the resume hook and cmdline to take effect
  ansible.builtin.debug:
    msg: >-
      omarchy hibernation setup rebuilt the initramfs and boot entries.
      Reboot, then verify with: grep -o 'resume[^ ]*' /proc/cmdline
  when: hibernation_setup is changed
