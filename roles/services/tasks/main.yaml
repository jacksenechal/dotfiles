- name: Enable night-mode as a user service
  when: inventory_hostname in groups['local']
  systemd:
    name: night-mode.service
    scope: user
    enabled: yes
    daemon_reload: yes
    state: restarted

# CPU stays at the firmware's balance_performance EPP otherwise. Only meaningful
# on amd-pstate-epp / intel_pstate HWP hosts, hence the stat guard. Skipped, and
# removed if present, where power-profiles-daemon is enabled: it owns EPP per
# profile there (Omarchy sets performance on AC at boot and reapplies on
# resume), and this unit would fight it, e.g. undoing power-saver on a laptop.
- name: Check for EPP support
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/cpu0/cpufreq/energy_performance_preference
  register: epp_sysfs

- name: Check whether power-profiles-daemon owns EPP
  ansible.builtin.command:
    argv: [systemctl, is-enabled, power-profiles-daemon.service]
  register: ppd
  check_mode: false  # read-only probe; keep it live so --check gates correctly
  changed_when: false
  failed_when: false

- name: Check for an installed cpu-epp-performance unit
  ansible.builtin.stat:
    path: /etc/systemd/system/cpu-epp-performance.service
  register: epp_unit

- name: Decide whether this host pins EPP to performance
  ansible.builtin.set_fact:
    epp_performance_wanted: "{{ epp_sysfs.stat.exists and ppd.rc != 0 }}"

- name: Install cpu-epp-performance unit
  become: yes
  ansible.builtin.copy:
    src: system/etc/systemd/system/cpu-epp-performance.service
    dest: /etc/systemd/system/cpu-epp-performance.service
    owner: root
    group: root
    mode: '0644'
  when: epp_performance_wanted

- name: Enable cpu-epp-performance
  become: yes
  systemd:
    name: cpu-epp-performance.service
    enabled: yes
    daemon_reload: yes
    state: started
  when: epp_performance_wanted

- name: Disable cpu-epp-performance where power-profiles-daemon owns EPP
  become: yes
  ansible.builtin.systemd:
    name: cpu-epp-performance.service
    enabled: no
    state: stopped
  when: not epp_performance_wanted and epp_unit.stat.exists

- name: Remove cpu-epp-performance unit where power-profiles-daemon owns EPP
  become: yes
  ansible.builtin.file:
    path: /etc/systemd/system/cpu-epp-performance.service
    state: absent
  when: not epp_performance_wanted and epp_unit.stat.exists

- name: Enable the docker service
  systemd:
    name: docker.service
    enabled: yes
    state: started
- name: Ensure user is in the docker group
  become: yes
  user:
    name: "{{ ansible_facts['user_id'] }}"
    append: yes
    groups: docker

# Generic systemd-sleep(8) hook: aborts any FUSE (Filesystem in Userspace)
# connection a task is wedged against in uninterruptible sleep (D state),
# so a stuck FUSE request can never block host suspend indefinitely. See
# files/system/usr/lib/systemd/system-sleep/fuse-sleep-guard for the
# detection/resolution logic. Replaces locomotive's incus-fuse-guard, which
# was lxcfs/Incus-specific and lived in that repo instead of here.
- name: Install fuse-sleep-guard system-sleep hook
  become: yes
  ansible.builtin.copy:
    src: system/usr/lib/systemd/system-sleep/fuse-sleep-guard
    dest: /usr/lib/systemd/system-sleep/fuse-sleep-guard
    owner: root
    group: root
    mode: '0755'

- name: Remove superseded incus-fuse-guard hook
  become: yes
  ansible.builtin.file:
    path: /usr/lib/systemd/system-sleep/incus-fuse-guard
    state: absent
