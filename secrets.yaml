---
# Bitwarden Secrets Manager delivery: SSH keys (~/.ssh/id*, ~/.ssh/config*) and
# API keys (~/.config/keys/*.key). Split out of the retired pi-base.yaml, which
# used to carry this role alongside pi. Nothing here is pi-specific.
#
# Requires a bws machine-account token on the TARGET host at
# ~/.config/bitwarden-sm/access-token. Without it this play fails; that is
# intentional, since silently skipping secret delivery is worse than a hard stop.
- name: Secrets (Bitwarden Secrets Manager)
  hosts: all
  become: false
  roles:
    - role: secrets
      tags: secrets
